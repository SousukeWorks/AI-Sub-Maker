name: Publish Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and test the portable application
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Virtual environment creation failed' }
          ./build.ps1
      - name: Verify assets and prepare release notes
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import re

          version = re.search(r'^VERSION = "(\d+\.\d+\.\d+)"', Path('app.py').read_text('utf-8'), re.M).group(1)
          assets = [Path('dist') / f'AI-Sub-Maker-{version}-{suffix}.zip'
                    for suffix in ('Windows11-x64', 'source')]
          private = {'soniox-key.dpapi', 'member-library.json', 'lyrics-library.json', 'settings.json'}
          for asset in assets:
              with ZipFile(asset) as archive:
                  assert archive.testzip() is None, f'ZIP CRC failed: {asset.name}'
                  assert not any(Path(name).name in private for name in archive.namelist()), 'Private data in ZIP'
          sums = []
          for asset in assets:
              digest = hashlib.file_digest(asset.open('rb'), 'sha256').hexdigest()
              sums.append(f'{digest}  {asset.name}')
          Path('dist/SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          Path('.work-temp').mkdir(exist_ok=True)
          Path('.work-temp/release-notes.md').write_text(
              f'AI-Sub-Maker {version} · Windows 11 x64\n\n'
              f'下载 **AI-Sub-Maker-{version}-Windows11-x64.zip**，完整解压后运行 '
              '**AI-Sub-Maker.exe**，保留旁边的 `_internal` 文件夹。无需安装 Python。\n\n'
              '- Soniox 日语识别与词级时间轴，DeepSeek 整批校对和简体中文翻译。\n'
              '- 上日语、下中文，各占一行；支持失败重试、词库与成员 / 合唱配色。\n'
              '- MP3＋图片生成 MP4，可独立使用。\n\n'
              'Soniox / DeepSeek 需自行填写 API Key，并按各自服务收费。'
              '完整歌词需自行导入，步骤见项目 README；不附带个人词库、歌词、Key 或处理记录。\n\n'
              'SHA256SUMS.txt 可用于核对下载文件。', encoding='utf-8')
      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& ./.venv/Scripts/python.exe -c 'from app import VERSION; print(VERSION)').Trim()
          $tag = 'v' + $version
          $assets = @("dist/AI-Sub-Maker-$version-Windows11-x64.zip", "dist/AI-Sub-Maker-$version-source.zip", 'dist/SHA256SUMS.txt')
          gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AI-Sub-Maker $tag" --notes-file .work-temp/release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed; existing releases are not overwritten' }
          $details = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $details.isDraft) { throw 'Unable to verify draft release' }
          foreach ($path in $assets) {
            $file = Get-Item -LiteralPath $path
            $uploaded = @($details.assets | Where-Object { $_.name -eq $file.Name })
            if ($uploaded.Count -ne 1 -or $uploaded[0].size -ne $file.Length) { throw ('Asset upload incomplete: ' + $file.Name) }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,tagName,isDraft
